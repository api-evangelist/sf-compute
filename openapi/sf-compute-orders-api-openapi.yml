openapi: 3.1.0
info:
  title: SF Compute Account Orders API
  description: 'SF Compute (San Francisco Compute Company) operates a market for buying

    short-duration time on H100 and H200 GPU clusters. This OpenAPI definition

    documents the public REST API surface advertised at https://docs.sfcompute.com.

    '
  version: v0
servers:
- url: https://api.sfcompute.com/v0
  description: Production
security:
- bearerAuth: []
tags:
- name: Orders
paths:
  /api/orders:
    get:
      tags:
      - Orders
      summary: List orders
      operationId: listOrders
      responses:
        '200':
          description: Orders
    post:
      tags:
      - Orders
      summary: Create order
      operationId: createOrder
      responses:
        '201':
          description: Created
  /api/orders/{id}:
    get:
      tags:
      - Orders
      summary: Get order details
      operationId: getOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Order
    delete:
      tags:
      - Orders
      summary: Cancel order
      operationId: cancelOrder
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Cancelled
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
